<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle corner rounding for the square file -->
  <rect width="300" height="300" fill="#0a0a0f"/>
  
  <defs>
    <!-- Enhanced vibrant glow -->
    <radialGradient id="logo-glow-special" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0" />
    </radialGradient>
    
    <!-- Gradient for the mark itself -->
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Larger background glow -->
  <circle cx="150" cy="150" r="140" fill="url(#logo-glow-special)"/>
  
  <!-- Subtle decorative ring to make it feel "premium" -->
  <circle cx="150" cy="150" r="148" stroke="white" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Scaled up main mark -->
  <g transform="translate(45, 45) scale(8.8)">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063A2 2 0 0 0 14.063 15.5l-1.582 6.135a.5.5 0 0 1-.962 0L9.937 15.5Z" fill="url(#mark-grad)"/>
    <path d="M20 3v4M22 5h-4M4 17v2M5 18H3" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
